name: Security inventory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only heuristic scan
        run: python3 scripts/security_audit.py --root . --output security-findings.json
      - name: Upload findings
        uses: actions/upload-artifact@v4
        with:
          name: security-findings
          path: security-findings.json
